name: Validate & deploy public roadmap

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protorhexis-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify public fixture and style constraints
        run: |
          npm run check:fixtures
          npm run check:style
          npm run check:gantt
          npm run check:layers
          npm run check:v25
          npm run check:v26
          npm run check:v29
          npm run check:v30
      - name: Build Astro static site
        run: npm run build
      - name: Install Playwright Chromium for real SSR hydration checks
        run: npx playwright install --with-deps chromium
      - name: Real browser smoke and interaction tests
        run: npm run test:e2e
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-browser-regression
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload PR build artifact for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-preview-dist
          path: dist
          retention-days: 3
          if-no-files-found: error
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
